<rect x="30" y="170" width="160" height="80" rx="8" fill="#f5f5f4" stroke="#57534e" stroke-width="2"/>
<text x="110" y="202" font-size="15" text-anchor="middle" fill="#1c1917">prompt x</text>
<text x="110" y="226" font-size="12.5" text-anchor="middle" fill="#57534e">one question</text>
<rect x="270" y="30" width="270" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="405" y="57" font-size="14.5" text-anchor="middle" fill="#1c1917">o&#8321;: wrong answer</text>
<text x="405" y="79" font-size="14.5" text-anchor="middle" fill="#dc2626">reward r&#8321; = 0</text>
<line x1="192" y1="210" x2="266" y2="62" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<rect x="270" y="128" width="270" height="64" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
<text x="405" y="155" font-size="14.5" text-anchor="middle" fill="#1c1917">o&#8322;: correct</text>
<text x="405" y="177" font-size="14.5" text-anchor="middle" fill="#059669">reward r&#8322; = 1</text>
<line x1="192" y1="210" x2="266" y2="160" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<rect x="270" y="226" width="270" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="405" y="253" font-size="14.5" text-anchor="middle" fill="#1c1917">o&#8323;: wrong</text>
<text x="405" y="275" font-size="14.5" text-anchor="middle" fill="#dc2626">reward r&#8323; = 0</text>
<line x1="192" y1="210" x2="266" y2="258" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<rect x="270" y="324" width="270" height="64" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
<text x="405" y="351" font-size="14.5" text-anchor="middle" fill="#1c1917">o&#8324;: correct</text>
<text x="405" y="373" font-size="14.5" text-anchor="middle" fill="#059669">reward r&#8324; = 1</text>
<line x1="192" y1="210" x2="266" y2="356" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<line x1="560" y1="62" x2="622" y2="62" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ad)"/>
<text x="594" y="48" font-size="15" text-anchor="middle" fill="#dc2626" font-weight="bold">&#194; = -1</text>
<text x="594" y="88" font-size="11.5" text-anchor="middle" fill="#6b7280">push down</text>
<line x1="560" y1="160" x2="622" y2="160" stroke="#059669" stroke-width="2.5" marker-end="url(#au)"/>
<text x="594" y="146" font-size="15" text-anchor="middle" fill="#059669" font-weight="bold">&#194; = +1</text>
<text x="594" y="186" font-size="11.5" text-anchor="middle" fill="#6b7280">push up</text>
<line x1="560" y1="258" x2="622" y2="258" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ad)"/>
<text x="594" y="244" font-size="15" text-anchor="middle" fill="#dc2626" font-weight="bold">&#194; = -1</text>
<text x="594" y="284" font-size="11.5" text-anchor="middle" fill="#6b7280">push down</text>
<line x1="560" y1="356" x2="622" y2="356" stroke="#059669" stroke-width="2.5" marker-end="url(#au)"/>
<text x="594" y="342" font-size="15" text-anchor="middle" fill="#059669" font-weight="bold">&#194; = +1</text>
<text x="594" y="382" font-size="11.5" text-anchor="middle" fill="#6b7280">push up</text>
<rect x="700" y="120" width="235" height="150" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="817" y="148" font-size="14" text-anchor="middle" fill="#1e3a8a">group statistics</text>
<text x="817" y="176" font-size="14" text-anchor="middle" fill="#1e3a8a">mean(r) = 0.5</text>
<text x="817" y="200" font-size="14" text-anchor="middle" fill="#1e3a8a">std(r) = 0.5</text>
<text x="817" y="232" font-size="14.5" text-anchor="middle" fill="#1e3a8a">A&#770;&#7522; = (r&#7522; &#8722; mean) / std</text>
<text x="817" y="256" font-size="12.5" text-anchor="middle" fill="#1d4ed8">baseline for free: no critic</text>
<text x="480" y="416" font-size="13.5" text-anchor="middle" fill="#44403c">same prompt, G rollouts: above-average answers pushed up, below-average pushed down</text>
</svg>